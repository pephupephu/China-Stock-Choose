name: Daily A-share Screener

on:
  schedule:
    # 10:30 UTC == 18:30 Asia/Shanghai (weekdays), after market close (15:00)
    # and the disclosure deadline (17:00-18:00) so new filings are available.
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      smoke:
        description: "Dry run: screen only, no email"
        required: false
        default: "false"

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run incremental weekly screener (daily chunk + Fri/complete push)
        env:
          AKSHARE_PROXY: ${{ secrets.AKSHARE_PROXY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_SUBJECT_PREFIX: ${{ secrets.EMAIL_SUBJECT_PREFIX }}
          LOG_LEVEL: INFO
          TOP_N: "200"
          INCREMENTAL_CHUNK: "700"
          WEEKLY_PUSH_WEEKDAY: "4"
        run: |
          if [ "${{ github.event.inputs.smoke }}" = "true" ]; then
            echo "Smoke mode: screening only, no email"
            python -m src.main screen
          else
            python -m src.main weekly
          fi

      - name: Commit output artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/pick_*.md output/pick_*.html output/pick_*.json || true
          if git diff --cached --quiet; then
            echo "No new artefacts to commit."
            exit 0
          fi
          git commit -m "chore: daily pick $(date -u +%F)"
          git push